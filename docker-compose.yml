services:
  db:
    image: postgres:16-alpine
    container_name: photodesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - photodesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: photodesk-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  photodesk_data:
